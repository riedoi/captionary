name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download FFmpeg
      run: python scripts/download_ffmpeg.py

    - name: Build Executable
      run: python build_executable.py

    # macOS Packaging
    - name: Package macOS
      if: matrix.os == 'macos-latest'
      run: |
        npm install -g create-dmg
        cd dist
        create-dmg Captionary.app || echo "DMG creation fallback"
        mv "Captionary 0.0.0.dmg" Captionary-macOS.dmg || mv *.dmg Captionary-macOS.dmg
        shasum -a 256 Captionary-macOS.dmg > Captionary-macOS.dmg.sha256

    # Upload Artifacts (per job)
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: artifacts-${{ matrix.os }}
        path: |
          dist/Captionary-macOS.dmg
          dist/Captionary-macOS.dmg.sha256
        if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: release-artifacts
          merge-multiple: true

      - name: Display Downloaded Files
        run: ls -R release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-artifacts/*
          draft: false # Set to false so releases are visible to the public immediately
          prerelease: false
